# Bygger EYE hver natt fra offentlige kilder og publiserer som statisk nettsted på GitHub Pages.
# Ingen server og ingen database i drift – det finnes ingenting å bryte seg inn i utenom GitHub selv.
name: publiser
on:
  schedule:
    - cron: '7 2 * * *'   # 03:07 norsk vintertid
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'content/**', 'src/**', 'tools/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --omit=dev
      # Forrige natts data og voteringscache: gir reserve hvis en kilde er nede, og sparer kall mot Stortinget.
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/eye.json
            data/votes-cache.json
          key: eye-data-${{ github.run_id }}
          restore-keys: eye-data-
      - run: node src/build.js
        env:
          DATA_DIR: data/
      - uses: actions/cache/save@v4
        if: always()
        with:
          # internal.json (med fødselsdatoer for matching) caches aldri
          path: |
            data/eye.json
            data/votes-cache.json
          key: eye-data-${{ github.run_id }}
      - run: node tools/pages.js data/eye.json site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
